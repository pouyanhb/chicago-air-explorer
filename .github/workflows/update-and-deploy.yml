name: Update Chicago air data and deploy

on:
  push:
    branches: [main]
  schedule:
    # The City data often lags; twice daily is sufficient.
    - cron: '23 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chicago-air-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
      - name: Install API client
        if: github.event_name != 'push'
        run: pip install -r scripts/requirements.txt
      - name: Refresh a limited range of completed UTC days
        if: github.event_name != 'push'
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/refresh_hourly.py
      - name: Save updated public summaries
        if: github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh published Chicago hourly summaries"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
